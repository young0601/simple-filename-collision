[project]
name = "simple-filename-collision"
version = "0.1.0"
description = "Resolves file name collisions during batch processing by keeping the first occurrence and renaming duplicates via pluggable strategies"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
